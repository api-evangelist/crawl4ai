aid: crawl4ai
name: Crawl4AI
description: >-
  Crawl4AI is an open-source, Apache-2.0 web crawler and scraper built to turn any
  URL into clean, LLM-ready data — Markdown, typed JSON, screenshots, PDFs, or a
  map of every URL on a domain. Operated by CONTEXT4AI PTE LTD of Singapore and
  created by Hossein Tohidi (@unclecode), the project pairs a 79,000-star Python
  library and self-hostable Docker API server with a hosted Cloud API at
  gate.crawl4ai.com that serves scrape, search, answer, extract and bulk-job
  endpoints from three regions, plus a live remote MCP server that exposes the
  same capabilities to agents as five native tools. Self-hosting is free and
  unmetered; the hosted tier is free at 5,000 searches and 1,000 scrapes a month.
