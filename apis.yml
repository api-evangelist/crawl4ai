apis:
  - aid: crawl4ai:crawl4ai
    name: Crawl4AI Cloud API
    description: >-
      The hosted Crawl4AI API. One key, plain JSON, one fast endpoint per job:
      POST /scrape turns a URL into clean Markdown or HTML, GET /search runs a
      browser-free multi-engine web search, GET /answer returns a direct answer
      with sources (experimental), POST /extract pulls typed JSON out of a page
      with an instruction and/or JSON Schema, POST /scrape/batch streams up to 50
      URLs as NDJSON, and POST /scrape/jobs drains lists of up to 10,000 URLs in
      the background. Requests route to the nearest of three regions (EU,
      Singapore, US). No OpenAPI is published for this surface.
    humanURL: https://gate.crawl4ai.com/docs
    baseURL: https://gate.crawl4ai.com
    tags:
      - AI Automation
      - Web Crawling
      - Search
    properties:
      - type: Documentation
        url: https://gate.crawl4ai.com/docs
      - type: APIReference
        url: https://gate.crawl4ai.com/docs
      - type: LLMsTxt
        url: llms/crawl4ai-llms.txt
      - type: MCPServer
        url: mcp/crawl4ai-mcp.yml
      - type: ToolCrosswalk
        url: mcp/crawl4ai-tool-crosswalk.yml
  - aid: crawl4ai:crawl4ai-v1
    name: Crawl4AI Cloud v1 API
    description: >-
      The versioned Crawl4AI cloud surface the first-party Cloud SDKs and the
      Claude Code plugin call. Covers POST /v1/markdown, /v1/screenshot (screenshot
      and PDF capture), /v1/extract (auto, LLM or reusable CSS schema), /v1/map
      (domain URL discovery with BM25 relevance scoring), /v1/crawl/site
      (whole-site crawl up to 1,000 pages) and /v1/crawl (the full 40-field
      CrawlerRunConfig), each with an async variant, a job API and webhook
      callbacks. Authenticated with X-API-Key. No OpenAPI is published; the
      reference lives in the provider's own agent skill.
    humanURL: >-
      https://github.com/unclecode/crawl4ai-cloud-sdk/blob/main/python/claude-plugin/skills/crawl4ai/reference/endpoints.md
    baseURL: https://api.crawl4ai.com
    tags:
      - AI Automation
      - Web Crawling
      - Data Extraction
    properties:
      - type: APIReference
        url: skills/reference/crawl4ai-endpoints.md
      - type: ErrorCatalog
        url: skills/reference/crawl4ai-errors.md
      - type: SourceCode
        url: https://github.com/unclecode/crawl4ai-cloud-sdk
  - aid: crawl4ai:crawl4ai-docker
    name: Crawl4AI Self-Hosted API
    description: >-
      The Apache-2.0 API server that ships inside the crawl4ai project and the
      unclecode/crawl4ai Docker image, serving on port 11235 on infrastructure the
      operator runs. Exposes /crawl, /crawl/stream, /crawl/job, /md, /llm,
      /screenshot, /pdf, /html, /token, /health, /artifacts/{id}, /hooks/info, a
      monitoring API and an MCP bridge at /mcp/sse, /mcp/ws and /mcp/schema. Since
      0.9.0 it is secure-by-default: authentication on, loopback bind without a
      token, and a strict request trust boundary.
    humanURL: https://docs.crawl4ai.com/core/self-hosting/
    baseURL: 'http://{host}:11235'
    baseURLNote: >-
      Templated on purpose — this server runs on the customer's own host. Crawl4AI
      operates no instance of it.
    tags:
