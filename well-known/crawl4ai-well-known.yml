description: >-
  Probe record for the RFC 8615 /.well-known/ surface on every Crawl4AI host.
  RESULT: NOTHING IS SERVED. No security.txt, no api-catalog, no OAuth or OpenID
  discovery, no agent card, on any host. No WellKnown, SecurityTxt or AgentCard
  pointer is emitted in apis.yml, because this file records an absence.
note: >-
  Two false-positive shapes were ruled out. crawl4ai.com 301s every path to
  docs.crawl4ai.com, which answers a 404 with a 31KB MkDocs HTML page — a 404
  body, not a document. api.crawl4ai.com is a single-page app whose catch-all
  answers HTTP 200 with the same 696-byte HTML shell for every /.well-known/*
  path, including agent-card.json and agent.json; those 200s are counted as
  MISSES, not hits, per the STEP 0b agent-card rule. Only two paths on that host
  return real JSON, and both are 404s.
