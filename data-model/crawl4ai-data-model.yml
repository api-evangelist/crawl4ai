  - {from: ScrapeResult, to: ProxyConfig, type: belongs_to, via: proxy}
id_prefixes:
  - {prefix: 'sk_live_', entity: ApiKey}
  - {prefix: 'j_', entity: Job, surface: gate}
  - {prefix: 'crawl_', entity: Job, surface: self-hosted}
observation: >-
  The model has no persistent, addressable customer-owned resources beyond Job and
  (self-hosted) artifact ids — Crawl4AI stores results, not accounts of objects.
  content_hash is the only stable identity a crawled page carries.
